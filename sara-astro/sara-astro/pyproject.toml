[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "sara-astro"
version = "0.1.0"
description = "A unified, higher-level Python interface for astronomical object analysis, built on Astropy, Astroquery, SIMBAD and Gaia."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11"
authors = [
    { name = "Nitish Kumar Sharma" },
]
keywords = ["astronomy", "astrophysics", "astropy", "astroquery", "simbad", "gaia"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Astronomy",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]

dependencies = [
    "astropy>=6.0",
    "astroquery>=0.4.7",
    "numpy>=1.26",
    "scipy>=1.11",
    "pandas>=2.1",
    "platformdirs>=4.0",
]

[project.optional-dependencies]
cli = ["click>=8.1"]
dev = [
    "pytest>=8.0",
    "pytest-mock>=3.12",
    "ruff>=0.5",
    "black>=24.0",
    "mypy>=1.10",
]

[project.scripts]
sara-astro = "sara_astro.cli:main"

[project.urls]
Homepage = "https://github.com/Nitishsharma234/sara-astro"
Issues = "https://github.com/Nitishsharma234/sara-astro/issues"

[tool.hatch.build.targets.wheel]
packages = ["sara_astro"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
